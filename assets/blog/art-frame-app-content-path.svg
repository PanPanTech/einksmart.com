<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540" role="img" aria-labelledby="title desc">
<title id="title">Where does an uploaded picture go</title><desc id="desc">Phone and desktop tools may send images through a cloud library or directly to local storage. Verify which routes your frame supports.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#146e68"/></marker></defs>
<rect width="1200" height="540" rx="24" fill="#f1f5f1"/>
<g font-family="Arial, sans-serif" fill="#172927"><text x="48" y="60" font-size="30" font-weight="700">Where does an uploaded picture go?</text><text x="48" y="96" font-size="19" fill="#526661">Possible routes — ask which ones your model actually supports.</text>
<g fill="#fff" stroke="#b9cac3" stroke-width="2"><rect x="48" y="160" width="250" height="108" rx="16"/><rect x="48" y="328" width="250" height="108" rx="16"/><rect x="472" y="160" width="250" height="108" rx="16"/><rect x="472" y="328" width="250" height="108" rx="16"/><rect x="893" y="240" width="259" height="140" rx="16"/></g>
<g text-anchor="middle"><text x="173" y="206" font-size="24" font-weight="700">Phone app</text><text x="173" y="239" font-size="18">Selected photos / albums</text><text x="173" y="374" font-size="24" font-weight="700">Desktop or SD card</text><text x="173" y="407" font-size="18">Files / folders</text><text x="597" y="206" font-size="24" font-weight="700">Cloud library</text><text x="597" y="239" font-size="18">Account and internet</text><text x="597" y="374" font-size="24" font-weight="700">Local storage</text><text x="597" y="407" font-size="18">Device memory / card</text><text x="1022" y="287" font-size="24" font-weight="700">Picture on the wall</text><text x="1022" y="322" font-size="18">Controller + panel</text><text x="1022" y="351" font-size="18">Verify actual playback</text></g>
<g fill="none" stroke="#146e68" stroke-width="3" marker-end="url(#arrow)"><path d="M310 214H458"/><path d="M310 382H458"/><path d="M736 214H806V279H881"/><path d="M736 382H806V341H881"/><path d="M310 237 455 350" stroke-dasharray="8 7"/></g>
<text x="48" y="491" font-size="19">Test upload, visibility and deletion in every interface you expect to use.</text><text x="1152" y="508" text-anchor="end" font-size="15" fill="#526661">einksmart · instructional diagram</text></g></svg>
