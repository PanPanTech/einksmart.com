<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="title desc">
<title id="title">Three different offline tests</title><desc id="desc">Keeping the last image, rotating stored images and adding a new image are separate capabilities. Test each separately.</desc>
<rect width="1200" height="420" rx="24" fill="#f1f5f1"/>
<g font-family="Arial, sans-serif" fill="#172927"><text x="48" y="61" font-size="30" font-weight="700">“Offline” needs three separate answers</text><text x="48" y="99" font-size="19" fill="#526661">Disconnect external internet first. Then test without local Wi-Fi.</text>
<g fill="#fff" stroke="#b9cac3" stroke-width="2"><rect x="48" y="141" width="350" height="192" rx="16"/><rect x="425" y="141" width="350" height="192" rx="16"/><rect x="802" y="141" width="350" height="192" rx="16"/></g>
<g fill="#146e68" font-size="38" font-weight="700"><text x="75" y="194">01</text><text x="452" y="194">02</text><text x="829" y="194">03</text></g>
<g font-size="24" font-weight="700"><text x="75" y="236">Keep the last picture</text><text x="452" y="236">Rotate stored pictures</text><text x="829" y="236">Add a new picture</text></g>
<g font-size="18" fill="#526661"><text x="75" y="271">Panel image retention</text><text x="75" y="302">No new-image test yet</text><text x="452" y="271">Controller + local playlist</text><text x="452" y="302">Keep normal power connected</text><text x="829" y="271">A supported local upload route</text><text x="829" y="302">Check setup and wake-up needs</text></g>
<text x="48" y="378" font-size="19">Passing one test does not establish a pass on the other two.</text><text x="1152" y="396" text-anchor="end" font-size="15" fill="#526661">einksmart · instructional diagram</text></g></svg>
